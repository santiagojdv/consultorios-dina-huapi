<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu turno · Consultorios Dina Huapi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2B3B5A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="turnos.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="wordmark" href="./" aria-label="Turnos, inicio"><svg class="iso" viewBox="8 8 94 64" aria-hidden="true"><circle class="c1" cx="40" cy="40" r="30"/><circle class="c2" cx="70" cy="40" r="30"/><path class="lens" d="M55 14.02 A30 30 0 0 1 55 65.98 A30 30 0 0 1 55 14.02 Z"/><path class="smile" d="M33 51 C 50 63, 76 58, 99 34 C 79 53, 54 58, 33 51 Z"/></svg><span class="wm"><span>CONSULTORIOS</span><span>DINA HUAPI</span></span></a>
  </div>
</header>
<main class="wrap">
  <h1>Tu turno</h1>
  <section class="card" id="caja"><p class="muted">Cargando…</p></section>
</main>
<script type="module">
import { sb, configurado, faltaConfig, $, h, aviso, mensajeError, hora, diaLargo, linkWhatsApp } from './comun.js';

const caja = $('#caja');
const token = new URLSearchParams(location.search).get('t');

if (!configurado) faltaConfig(caja);
else if (!token || !/^[0-9a-f-]{36}$/i.test(token)) aviso(caja, 'El link no es válido. Revisá que esté completo.');
else cargar();

async function cargar() {
  const { data, error } = await sb.rpc('turno_por_token', { p_token: token });
  if (error) return aviso(caja, mensajeError(error));
  if (!data) return aviso(caja, 'No encontramos ese turno. Revisá que el link esté completo.');
  mostrar(data);
}

function mostrar(t, mensaje) {
  const cancelado = t.estado === 'cancelado';
  const contacto = t.telefono_profesional
    ? h('a', { class: 'btn ghost', target: '_blank', rel: 'noopener',
        href: linkWhatsApp(t.telefono_profesional, `Hola, soy ${t.paciente}. Te escribo por mi turno del ${diaLargo(t.inicio)} a las ${hora(t.inicio)}.`) },
        'Escribir al profesional')
    : null;

  caja.replaceChildren(...[
    mensaje ? h('div', { class: 'aviso ok' }, mensaje) : null,
    cancelado && !mensaje ? h('div', { class: 'aviso info' }, 'Este turno está cancelado.') : null,
    h('div', { class: 'stack' },
      h('p', {}, h('strong', {}, `${diaLargo(t.inicio)}, ${hora(t.inicio)} h`)),
      h('p', {}, `${t.profesional}${t.especialidad ? ` · ${t.especialidad}` : ''}`),
      h('p', { class: 'muted' }, `${t.consultorio ?? ''} · Paciente: ${t.paciente}`)),
    !cancelado && t.cancelable
      ? h('div', { class: 'row' },
          h('button', { class: 'btn danger', type: 'button', onclick: cancelar }, 'Cancelar turno'), contacto)
      : null,
    !cancelado && !t.cancelable
      ? h('div', { class: 'stack' },
          h('p', { class: 'aviso info' }, `Faltan menos de ${t.aviso_cancelacion_horas} h para el turno: ya no se puede cancelar online. Avisale directamente al profesional.`),
          contacto)
      : null,
    cancelado ? h('div', {}, h('a', { class: 'btn', href: './' }, 'Sacar un turno nuevo')) : null,
  ].filter(Boolean));
}

async function cancelar(ev) {
  if (!confirm('¿Seguro que querés cancelar el turno?')) return;
  ev.target.disabled = true;
  const { data, error } = await sb.rpc('cancelar_turno', { p_token: token });
  if (error) { ev.target.disabled = false; return aviso(caja, mensajeError(error)); }
  mostrar(data, 'Listo, el turno quedó cancelado. Gracias por avisar.');
}
</script>
</body>
</html>
